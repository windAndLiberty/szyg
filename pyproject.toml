[project]
name = "szyg"
version = "1.0.0"
description = "智能矩阵运营系统 - 自托管AI工具平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx[socks]>=0.27.0",
    "requests>=2.33.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "python-multipart>=0.0.17",
    "sse-starlette>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "aiofiles>=24.1.0",
    "openai>=2.43.0",
    "playwright>=1.60.0",
    "bilibili-api-python>=17.4.2",
    "douyin-tiktok-scraper>=1.2.9",
    "pyexecjs>=1.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]
platforms = [
    "playwright>=1.48.0",        # 浏览器自动化 (抖音/小红书)
    "patchright==1.58.2",        # 发布器 Chromium 驱动（与已审计的 revision 1208 匹配）
    "concurrent-log-handler==0.9.29", # Windows 打包运行时日志
    "portalocker==4.1.0",        # concurrent-log-handler 的文件锁依赖
    "loguru==0.7.3",            # 社媒上传器结构化日志
    "opencv-python==4.13.0.92",  # 社媒登录二维码识别
    "segno==1.6.6",             # 终端二维码渲染
    "uiautomation>=2.0",         # Windows UI Automation (微信桌面版)
    "comtypes>=1.4.0",           # UIAutomation COM bindings
    "pywin32>=306",              # Windows API (剪贴板操作)
    "pyperclip>=1.9.0",          # wxauto clipboard support
    "py-mini-racer>=0.6.0",      # V8 JS引擎 (反爬签名)
    "psutil>=5.9.0",             # 进程管理
]
skills = [
    "openpyxl>=3.1.0",           # Excel 读写 → 内容日历/数据分析/批量导出
    "python-docx>=1.1.0",        # Word 文档 → 脚本大纲/创意简报/批量转换
    "python-pptx>=1.0.0",        # PPT 演示 → 社媒轮播图/品牌模板
    "PyPDF2>=3.0.0",             # PDF 合并/拆分
    "pdfplumber>=0.11.0",        # PDF 文本提取 (优于 PyPDF2)
    "beautifulsoup4>=4.12.0",    # HTML 解析 → web_tools 抓取
    "html2text>=2024.0",         # HTML→Markdown → web_tools 转换
]

[tool.hatch.build.targets.wheel]
packages = ["server/szyg"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "real_service: tests that require real external services (Ollama, media providers, etc.)",
]

[tool.coverage.run]
source = ["szyg"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
