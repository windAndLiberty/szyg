# ╔══════════════════════════════════════════════════════════════╗
# ║           「域灵」数字员工系统 — 主配置文件                   ║
# ╚══════════════════════════════════════════════════════════════╝
#
# 环境变量加载: ${VAR_NAME} 或 ${VAR_NAME:default_value}
# 优先级: 环境变量 > 此文件 > 代码默认值
#
# ⚠️  生产环境: 删除此文件中的真实 key，仅保留 ${VAR} 引用

# =============================================================================
# LLM 后端
# =============================================================================
llm:
  # 默认使用的 LLM 后端: volcengine | ollama
  default_backend: volcengine

  # ------------------------------------------------------------------
  # 本地小模型 — szyg 内置 llama.cpp 运行时
  # 用于摘要、分类、改写、评论初稿等低风险小任务；主力对话仍走 API 模型。
  local_llama:
    enabled: true
    base_url: "http://127.0.0.1:11435/v1"
    default_model: "qwen3-4b"
    optional_model: "qwen3-8b"
    auto_start: true
    task_timeout_seconds: 30

  # ------------------------------------------------------------------
  # Ollama — 本地 LLM (免费, 需安装 ollama)
  # 安装: curl -fsSL https://ollama.ai/install.sh | sh
  ollama:
    enabled: true
    base_url: "http://localhost:11434"
    default_model: "qwen3:0.6B"               # 本地模型，按需修改
    timeout: 120                               # 冷启动可能较慢

  # ------------------------------------------------------------------
  # LiteLLM — 自托管 LLM 网关 (OpenAI 兼容)
  liteLLM:
    enabled: false
    api_key: "${LITELLM_API_KEY:-}"
    base_url: "http://localhost:4000"
    default_model: "gpt-4"
    timeout: 60

  # ------------------------------------------------------------------
  # 火山引擎方舟 — 统一多模态AIGC API (OpenAI兼容)
  # 获取 key: https://console.volcengine.com/ark → 推理接入点
  # 一个API Key调用: LLM / 图像 / 视频 / 语音 / 向量嵌入
  volcengine:
    enabled: true
    api_key: "${VOLCENGINE_API_KEY:-}"
    # OpenSpeech 大模型语音合成 API Key，用于 seed-audio-1.0。
    # 新版控制台获取后设置 VOLCENGINE_SPEECH_API_KEY。
    speech_api_key: "${VOLCENGINE_SPEECH_API_KEY:}"
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    timeout: 120
    max_retries: 3
    output_dir: "./data/volcengine_output"

    # 推理接入点ID (在火山方舟控制台创建)
    endpoints:
      # ═══════════════════════════════════════════════════════════════
      # 文本模型 — 火山方舟免费额度支持直接用模型ID调用 (无需endpoint)
      # 以下模型实测可用 (2026-06-22):
      #   doubao-seed-2-0-pro-260215   (旗舰)
      #   doubao-seed-2-0-lite-260428  (高性价比)
      #   doubao-seed-2-0-mini-260428  (轻量)
      #   doubao-seed-1-6-251015       (稳定版)
      #   doubao-seed-1-6-flash-250828 (极速 Flash)
      #   doubao-1-5-pro-32k-250115    (经典 Pro 32K)
      #   doubao-1-5-lite-32k-250115   (经典 Lite 32K)
      #   deepseek-v4-flash-260425     (DeepSeek V4 Flash 推理)
      #   doubao-seed-2-0-code-preview-260215 (代码专用)
      # 不可用: deepseek-r1/v3 系列, kimi-k2 系列, qwen/glm 开源系列
      # ═══════════════════════════════════════════════════════════════
      doubao-pro-128k: "doubao-seed-2-0-pro-260215"
      doubao-lite: "doubao-seed-2-0-lite-260428"
      doubao-seed-1-6-lite-251015: "doubao-seed-1-6-lite-251015"
      deepseek-r1: "deepseek-v4-flash-260425"
      deepseek-v3: "deepseek-v4-flash-260425"
      # Smart Router 兜底 (自动路由, 但会覆盖模型选择, 暂时禁用)
      # default-text: "ep-20260609154149-9bkrb"
      # 图像模型 — doubao-seedream 文生图接入点 (实测可用)
      doubao-image: "ep-20260609192748-28bcc"
      sdxl: ""
      flux: ""
      # 视频模型 — doubao-seedance 视频生成接入点 (实测可用)
      doubao-video: "ep-20260619184527-7b9h2"
      doubao-seedance-1-5-pro-251215: "doubao-seedance-1-5-pro-251215"
      doubao-seedance-2.0: "ep-20260711112636-kvsr7"
      seaweed: ""
      # 语音模型 — 需到方舟控制台创建推理接入点
      # 可用的模型ID: (需创建endpoint后才能用)
      doubao-tts: ""
      doubao-voice-clone: ""
      # 向量模型 — 需到方舟控制台创建推理接入点
      # 可用模型ID: doubao-embedding-text-240715, doubao-embedding-large-text-240915
      doubao-embedding: ""

  # LLM 通用设置
  fallback_enabled: true                      # 主后端失败时自动降级
  fallback_order: ["ollama"]                  # 降级顺序

# =============================================================================
# 图像生成
# =============================================================================
image:
  # 默认图像生成后端: comfyui | volcengine
  # ComfyUI 优先（本地免费无限），VolcEngine Seedream 云端降级
  default_backend: comfyui

  # ------------------------------------------------------------------
  # ComfyUI — 本地 SD 2.1 (免费，GTX 1650 4GB)
  comfyui:
    enabled: true
    api_url: "http://localhost:8188"
    output_dir: "./data/comfyui_output"
    checkpoint: "v2-1_768-ema-pruned.safetensors"
    steps: 15
    timeout: 300

# =============================================================================
# 语音 (TTS)
# =============================================================================
tts:
  # 默认 TTS 后端: edge_tts (免费, 无需 key)
  backend: edge_tts

  # ------------------------------------------------------------------
  # edge-tts — 微软免费 TTS (无需 API key)
  # 中文语音: zh-CN-XiaoxiaoNeural (女声) / zh-CN-YunxiNeural (男声)
  edge_tts:
    voice: "zh-CN-XiaoxiaoNeural"             # 默认中文女声
    rate: "+0%"                                # 语速: -50% ~ +100%
    pitch: "+0Hz"                              # 音调

# =============================================================================
# 视频处理
# =============================================================================
video:
  ffmpeg_path: "D:\\tools\\ffmpeg\\bin\\ffmpeg.exe"     # ffmpeg 二进制路径
  ffprobe_path: "D:\\tools\\ffmpeg\\bin\\ffprobe.exe"   # ffprobe 路径
  default_video_codec: "libx264"              # 视频编码
  default_audio_codec: "aac"                  # 音频编码
  threads: 4                                  # 编码线程数
  output_dir: "./data/output"                 # 输出目录
  templates_dir: "./data/ffmpeg_templates"    # 模板目录
  generation:
    # 开发阶段默认使用 Doubao-Seedance 2.0。
    # 后续拿到 Seedance 2.5 的真实 endpoint 后，改这里即可切换默认调用模型。
    default_model: "doubao-seedance-2.0"
    compose_default_model: "doubao-seedance-1.5-pro"
    compose_vision_model: "doubao-seed-2-0-pro-260215"
    compose_planner_model: "doubao-seed-2-0-pro-260215"
    storyboard_remote_model: "doubao-seed-2-0-lite-260428"
    prompt_optimize_model: "doubao-seed-2-0-lite-260428"
    defaults:
      duration: 15
      size: "720p"
      ratio: "9:16"
      native_audio: false
      count: 1
    models:
      doubao-seedance-1.5-pro:
        provider_model: "doubao-seedance-1-5-pro-251215"
        label: "Doubao-Seedance 1.5"
        sizes: ["720p", "1080p"]
        min_duration: 4
        max_duration: 12
        native_audio: true
      doubao-seedance-2.0-fast:
        provider_model: "doubao-seedance-2.0-fast"
        label: "Doubao-Seedance 2.0 Fast"
        sizes: ["720p"]
        min_duration: 4
        max_duration: 15
        native_audio: true
      doubao-seedance-2.0:
        provider_model: "doubao-seedance-2.0"
        label: "Doubao-Seedance 2.0"
        sizes: ["720p", "1080p"]
        min_duration: 4
        max_duration: 15
        native_audio: true
      doubao-seedance-2.5:
        # 未开通时保持为空；配置为真实 ep-xxxx 后即可启用原生 4K/30s 档位。
        provider_model: "doubao-seedance-2.5"
        label: "Doubao-Seedance 2.5"
        sizes: ["720p", "1080p", "4K"]
        min_duration: 3
        max_duration: 30
        native_audio: true

# =============================================================================
# 内容生成
# =============================================================================
content:
  graphic:
    multimodal_model: "ep-20260714133840-lckqb"

# =============================================================================
# 内容发布
# =============================================================================
publishing:
  title_model: "doubao-seed-2-0-lite-260428"
  title_limits:
    douyin:
      note: 20
    xhs:
      note: 20

# =============================================================================
# 知识库 & Memory
# =============================================================================
knowledge:
  db_path: "./data/knowledge.db"              # 知识库 SQLite 路径
  chunk_size: 500                             # 文档分块大小(字符)
  chunk_overlap: 50                           # 块间重叠

memory:
  db_path: "./data/memory.db"                 # 记忆库 SQLite 路径
  enable_fts: true                            # 启用全文检索
  embedding_dim: 768                          # 向量维度(预留)
  similarity_threshold: 0.75                  # 相似度阈值
  max_history_per_session: 20                 # 每会话最大历史
  auto_summarize_after: 10                    # 自动摘要阈值

# =============================================================================
# SOP 工作流
# =============================================================================
sop:
  db_path: "./data/sop.db"                    # SOP 存储路径
  auto_load: true                             # 启动时自动加载已保存 SOP

# =============================================================================
# API 服务
# =============================================================================
api:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  reload: false                               # 开发模式热重载(生产关)
  cors_origins: ["http://localhost:5173", "http://localhost:8000"]  # CORS 允许来源 (生产环境替换为真实域名)
  api_key: "${YULING_API_KEY:-}"              # API 访问密钥(空=不校验)
  request_timeout: 120
  enable_docs: true                           # Swagger /docs

# =============================================================================
# Wechaty 微信
# =============================================================================
wechaty:
  enabled: false                              # 开发阶段默认关闭
  name: "域灵助手"
  puppet: "wechaty-puppet-wechat"            # 或 wechaty-puppet-padlocal
  token: "${WECHATY_TOKEN:-}"                # Puppet token
  endpoint: "${WECHATY_ENDPOINT:-}"          # PadLocal endpoint
  auto_accept_friend: false                   # 自动通过好友
  allowed_groups: []                          # 允许的群(空=全部)
  cooldown_seconds: 1                         # 消息冷却

# =============================================================================
# 日志 & 调试
# =============================================================================
debug: false                                   # 调试模式
log_level: "INFO"                              # DEBUG | INFO | WARNING | ERROR
data_dir: "./data"                             # 数据根目录

# =============================================================================
# 平台自动化配置 — 对标数创引擎的多平台自动营销
# =============================================================================
platforms:
  # 浏览器自动化配置 (Playwright)
  browser:
    headless: false                               # 是否无头模式 (false=有头，避免检测)
    channel: "chrome"                             # 浏览器通道: chrome | msedge | chromium
    viewport_width: 1536
    viewport_height: 864
    stealth_enabled: true                         # 注入 stealth.min.js

  # 真实桌面浏览器接管配置
  # 用于视频号、公众号后台等容易拒绝托管浏览器的业务页面。
  desktop_browser:
    browser: "msedge"
    executable_path: ""                           # 留空自动查找 Edge
    profile_root: "./data/browser_profiles"
    remote_debugging_port: 9223
    no_proxy: true
    profiles:
      tencent_channels_edge:
        browser: "msedge"
        profile_dir: "./data/browser_profiles/tencent_channels_edge"
        remote_debugging_port: 9223
        no_proxy: true

  # 抖音创作服务平台
  douyin:
    enabled: true
    creator_url: "https://creator.douyin.com"
    publish_url: "https://creator.douyin.com/creator-micro/content/upload"
    login_timeout: 300                            # 扫码登录超时(秒)
    max_title_length: 1000
    max_images: 12
    max_tags: 5

  # 小红书创作服务平台
  xiaohongshu:
    enabled: true
    creator_url: "https://creator.xiaohongshu.com"
    publish_url: "https://creator.xiaohongshu.com/publish/publish"
    login_timeout: 300
    max_title_length: 20
    max_body_length: 1000
    max_images: 18
    max_tags: 5

  # 微信桌面客户端 (Windows UIA)
  wechat:
    enabled: true
    exe_paths:                                    # 微信安装路径
      - "C:\\Program Files\\Tencent\\WeChat\\WeChat.exe"
      - "C:\\Program Files (x86)\\Tencent\\WeChat\\WeChat.exe"
    login_timeout: 300
    max_moments_text: 2000
    max_moments_images: 9

  # 反爬签名 (PyMiniRacer 或 Node.js)
  signatures:
    engine: "auto"                                # auto | py_mini_racer | node
