# szyg 密钥配置模板 — 复制为 secrets.yaml 并填入真实值
# 产品阶段将废弃，改用环境变量

llm:
  kimi:
    api_key: "sk-kimi-xxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://api.moonshot.cn/v1"
    default_model: "kimi-k2-0905-preview"
  modelscope:
    api_key: "ms-xxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://api-inference.modelscope.cn/v1"
  deepseek:
    api_key: "${DEEPSEEK_API_KEY:-}"
    base_url: "https://api.deepseek.com/v1"

platforms:
  douyin:
    test_account: ""
    test_password: ""

github:
  token: ""

# ═══════════════════════════════════════════════════════════════
# 火山引擎方舟 — 统一多模态AIGC API
# ═══════════════════════════════════════════════════════════════
volcengine:
  api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxx"           # 火山引擎API Key
  base_url: "https://ark.cn-beijing.volces.com/api/v3"

  # 推理接入点ID (在火山方舟控制台 → 推理 → 创建接入点)
  endpoints:
    # 文本模型
    doubao-pro-128k: "ep-2025xxxxxx-xxxxx"         # 豆包Pro 128K
    doubao-lite: "ep-2025xxxxxx-xxxxx"             # 豆包Lite
    deepseek-r1: "ep-2025xxxxxx-xxxxx"             # DeepSeek-R1
    deepseek-v3: "ep-2025xxxxxx-xxxxx"             # DeepSeek-V3
    # 图像模型
    doubao-image: "ep-2025xxxxxx-xxxxx"            # 豆包·文生图
    sdxl: "ep-2025xxxxxx-xxxxx"                    # SDXL
    flux: "ep-2025xxxxxx-xxxxx"                    # FLUX
    # 视频模型
    doubao-video: "ep-2025xxxxxx-xxxxx"            # 豆包·视频生成
    seaweed: "ep-2025xxxxxx-xxxxx"                 # Seaweed
    # 语音模型
    doubao-tts: "ep-2025xxxxxx-xxxxx"              # 豆包·语音合成
    doubao-voice-clone: "ep-2025xxxxxx-xxxxx"      # 豆包·声音克隆
    # 向量模型
    doubao-embedding: "ep-2025xxxxxx-xxxxx"        # 豆包·向量嵌入

other:
  szyg_server_host: "127.0.0.1"
  szyg_server_port: 8000
