<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SZYG 内测管理</title>
  <style>
    :root{color-scheme:dark;--bg:#080b12;--panel:#111722;--line:#263044;--muted:#8b98ad;--text:#eef2f8;--accent:#6678ff;--ok:#26b981;--warn:#f5b742;--danger:#ef6671}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,"Microsoft YaHei",sans-serif;letter-spacing:0}
    button,input{font:inherit}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:28px 18px;background:#0c111a}.brand{font-size:18px;font-weight:700;margin:0 10px 28px}.brand span{color:#93a0ff}.nav{display:grid;gap:6px}.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:10px 12px;text-align:left;border-radius:6px;cursor:pointer}.nav button.active,.nav button:hover{background:#182134;color:var(--text)}
    main{padding:28px 32px;max-width:1500px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.top h1{font-size:22px;margin:0}.top p{color:var(--muted);margin:4px 0 0}.btn{border:1px solid var(--line);background:#171e2b;color:var(--text);padding:9px 14px;border-radius:6px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.danger{color:#ff9ca5}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:7px}.metric{padding:17px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:25px;margin-top:7px}.panel{margin-top:14px;overflow:hidden}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head h2{font-size:15px;margin:0}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:780px}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid #20293a}th{font-size:12px;color:var(--muted);font-weight:500}.badge{display:inline-flex;padding:3px 8px;border-radius:999px;background:#222c3c;color:#b9c4d6;font-size:12px}.badge.ok{background:#10372c;color:#72dfb5}.badge.bad{background:#3b1d25;color:#ff9ba5}.actions{display:flex;gap:7px}.actions button{padding:5px 8px}.hidden{display:none!important}.login{max-width:390px;margin:14vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.login h1{margin:0 0 6px}.login p{color:var(--muted);margin:0 0 20px}.field{display:grid;gap:6px;margin:13px 0}.field label{color:var(--muted)}input{width:100%;border:1px solid var(--line);background:#0b1019;color:var(--text);padding:10px 11px;border-radius:6px;outline:0}input:focus{border-color:var(--accent)}.toast{position:fixed;right:22px;bottom:22px;background:#1c2534;border:1px solid var(--line);padding:11px 15px;border-radius:6px}.modal{position:fixed;inset:0;background:#05070bb8;display:grid;place-items:center}.modal-card{width:min(460px,calc(100vw - 36px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px}.modal-card h2{margin:0 0 15px}.code{padding:12px;background:#0b1019;border:1px dashed #465572;border-radius:6px;word-break:break-all;color:#bac4ff}@media(max-width:800px){.shell{display:block}.side{display:none}main{padding:20px}.grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <section id="login" class="login">
    <h1>SZYG 内测管理</h1><p>管理用户开通、用量和智能服务状态。</p>
    <div class="field"><label>管理员邮箱</label><input id="email" type="email" /></div>
    <div class="field"><label>密码</label><input id="password" type="password" /></div>
    <div class="field"><label>动态验证码</label><input id="totp" inputmode="numeric" placeholder="未启用时留空" /></div>
    <button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">登录</button>
  </section>
  <section id="app" class="shell hidden">
    <aside class="side"><div class="brand">SZYG <span>Control</span></div><nav class="nav"><button class="active">内测概览</button><button onclick="showUsers()">用户管理</button><button onclick="showUsage()">API 用量</button><button onclick="showModels()">能力状态</button><button onclick="showFeedback()">用户反馈</button></nav></aside>
    <main><div class="top"><div><h1>内测概览</h1><p>用户、设备、额度与智能服务运行情况。</p></div><button class="btn primary" onclick="openInvite()">开通用户</button></div>
      <div class="grid"><div class="metric"><small>内测用户</small><strong id="totalUsers">-</strong></div><div class="metric"><small>正常用户</small><strong id="activeUsers">-</strong></div><div class="metric"><small>本月 API 请求</small><strong id="monthRequests">-</strong></div><div class="metric"><small>请求成功率</small><strong id="successRate">-</strong></div></div>
      <section class="panel"><div class="panel-head"><h2 id="tableTitle">最近开通用户</h2><button class="btn" onclick="loadAll()">刷新</button></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section>
    </main>
  </section>
  <div id="inviteModal" class="modal hidden"><div class="modal-card"><h2>开通内测用户</h2><div class="field"><label>邮箱</label><input id="inviteEmail" type="email" /></div><div class="field"><label>企业或团队名称</label><input id="orgName" /></div><div class="field"><label>有效天数</label><input id="days" type="number" value="30" min="1" /></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" onclick="closeInvite()">取消</button><button class="btn primary" onclick="invite()">生成邀请码</button></div><div id="inviteResult" class="hidden" style="margin-top:16px"><div class="code" id="inviteCode"></div></div></div></div>
  <div id="toast" class="toast hidden"></div>
  <script>
    let accessToken=''; const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
    async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',Authorization:`Bearer ${accessToken}`,...options.headers}});if(!response.ok){let d={};try{d=await response.json()}catch{}throw new Error(typeof d.detail==='string'?d.detail:(d.detail?.message||'操作未完成'))}return response.json()}
    async function login(){try{const installation_id=localStorage.getItem('admin_installation')||crypto.randomUUID();localStorage.setItem('admin_installation',installation_id);const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value,totp_code:$('totp').value,device:{installation_id,name:'管理后台',app_version:'web-admin'}})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'登录失败');accessToken=d.access_token;$('login').classList.add('hidden');$('app').classList.remove('hidden');await loadAll()}catch(e){toast(e.message)}}
    async function loadAll(){try{const [d,u]=await Promise.all([api('/api/v1/admin/dashboard'),api('/api/v1/admin/users')]);$('totalUsers').textContent=d.users.total;$('activeUsers').textContent=d.users.active;$('monthRequests').textContent=d.requests.month;$('successRate').textContent=d.success_rate+'%';renderUsers(u.items)}catch(e){toast(e.message)}}
    function renderUsers(items){$('tableTitle').textContent='内测用户';$('thead').innerHTML='<tr><th>用户</th><th>状态</th><th>Credits</th><th>设备</th><th>授权到期</th><th>最近登录</th><th>操作</th></tr>';$('tbody').innerHTML=items.filter(x=>x.role!=='admin').map(x=>`<tr><td><strong>${esc(x.display_name||x.email)}</strong><br><small style="color:var(--muted)">${esc(x.email)}</small></td><td><span class="badge ${x.status==='active'?'ok':'bad'}">${x.status==='active'?'正常':'已暂停'}</span></td><td><strong>${Number(x.credits?.balance||0).toLocaleString('zh-CN',{maximumFractionDigits:4})}</strong><br><small style="color:var(--muted)">已用 ${Number(x.credits?.spent||0).toLocaleString('zh-CN',{maximumFractionDigits:4})}</small></td><td>${x.device_count}/${x.entitlement.device_limit}</td><td>${fmt(x.entitlement.valid_until)}</td><td>${fmt(x.last_login_at)}</td><td class="actions"><button class="btn ${x.status==='active'?'danger':''}" onclick="setStatus('${x.id}','${x.status==='active'?'suspended':'active'}')">${x.status==='active'?'暂停':'恢复'}</button></td></tr>`).join('')||'<tr><td colspan="7" style="color:var(--muted)">还没有内测用户</td></tr>'}
    const fmt=v=>v?new Date(v).toLocaleString('zh-CN'):'—'; async function showUsers(){try{renderUsers((await api('/api/v1/admin/users')).items)}catch(e){toast(e.message)}}
    async function setStatus(id,status){try{await api(`/api/v1/admin/users/${id}/status`,{method:'PUT',body:JSON.stringify({status})});toast('状态已更新');loadAll()}catch(e){toast(e.message)}}
    async function showUsage(){try{const d=await api('/api/v1/admin/usage?limit=200');$('tableTitle').textContent='最近 API 请求';$('thead').innerHTML='<tr><th>时间</th><th>能力</th><th>状态</th><th>用量</th><th>耗时</th><th>错误</th></tr>';$('tbody').innerHTML=d.items.map(x=>`<tr><td>${fmt(x.created_at)}</td><td>${esc(x.capability)}</td><td><span class="badge ${x.status==='succeeded'?'ok':x.status==='failed'?'bad':''}">${esc(x.status)}</span></td><td>${x.units} ${esc(x.unit_type)}</td><td>${x.latency_ms}ms</td><td>${esc(x.error_code||'—')}</td></tr>`).join('')}catch(e){toast(e.message)}}
    async function showModels(){try{const d=await api('/api/v1/admin/models');$('tableTitle').textContent='智能能力状态';$('thead').innerHTML='<tr><th>业务能力</th><th>配置</th><th>状态</th><th>灰度比例</th></tr>';$('tbody').innerHTML=d.items.map(x=>`<tr><td>${esc(x.alias)}</td><td>${x.configured?'已配置':'未配置'}</td><td><span class="badge ${x.enabled?'ok':'bad'}">${x.enabled?'可用':'停用'}</span></td><td>${x.rollout_percent}%</td></tr>`).join('')}catch(e){toast(e.message)}}
    async function showFeedback(){try{const d=await api('/api/v1/admin/feedback');$('tableTitle').textContent='用户反馈';$('thead').innerHTML='<tr><th>时间</th><th>类型</th><th>内容</th><th>请求编号</th><th>状态</th></tr>';$('tbody').innerHTML=d.items.map(x=>`<tr><td>${fmt(x.created_at)}</td><td>${esc(x.category)}</td><td>${esc(x.message)}</td><td>${esc(x.request_id||'—')}</td><td>${esc(x.status)}</td></tr>`).join('')}catch(e){toast(e.message)}}
    function openInvite(){$('inviteModal').classList.remove('hidden');$('inviteResult').classList.add('hidden')}function closeInvite(){$('inviteModal').classList.add('hidden')}
    async function invite(){try{const d=await api('/api/v1/admin/invitations',{method:'POST',body:JSON.stringify({email:$('inviteEmail').value,organization_name:$('orgName').value,entitlement_days:Number($('days').value),device_limit:2,quotas:{}})});$('inviteCode').textContent=`邀请码：${d.invitation_code}\n激活地址：${d.activation_url}`;$('inviteResult').classList.remove('hidden');toast('邀请码已生成')}catch(e){toast(e.message)}}
  </script>
</body>
</html>
